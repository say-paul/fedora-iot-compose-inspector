name: Daily Fedora IoT Compose Check

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  check-composes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Run Fedora IoT inspection script
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID || 'itpc-ca-b7a2ceb3c4' }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION || 'us-east5' }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISABLE_SLACK: 'false'  # TODO: Change to 'false' after testing is complete
#          OVERRIDE_DATE: '20260818'  # TODO: Remove after testing - using yesterday's date to test AI analysis
        run: python check_fedora_iot.py

      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: daily-report-*.json
          retention-days: 90
